name: 1-preparar-assets

# Recibe un manifiesto ya escrito y aprobado.
# Puede preparar una semana o el ciclo completo. No redacta ni modifica copy.

on:
  workflow_dispatch:
    inputs:
      mes:
        description: "Ciclo editorial (YYYY-MM)."
        required: true
      semana:
        description: "Semana a preparar. 'todas' exige el ciclo completo aprobado."
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - todas

permissions:
  contents: write
  id-token: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar contenido aprobado
        shell: bash
        run: |
          set -euo pipefail
          SEMANA_ARGS=()
          if [ "${{ inputs.semana }}" != "todas" ]; then
            SEMANA_ARGS=(--semana "${{ inputs.semana }}")
          fi
          python scripts/mes.py --mes "${{ inputs.mes }}" "${SEMANA_ARGS[@]}" --require-approved

      - name: Diseñar carruseles sin alterar copy
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-opus-4-8 --allowedTools Read,Write,Edit,Glob,Grep,Bash"
          show_full_output: true
          prompt: |
            CICLO: "${{ inputs.mes }}"
            SEMANA: "${{ inputs.semana }}"
            Leé scripts/PROMPT_preparar_assets_mes.md y ejecutalo exactamente para el alcance indicado.
            El contenido ya está aprobado: no cambies una sola palabra ni ningún campo del manifiesto.
            No leas archive/** y no modifiques ningún archivo relacionado con creación o edición de video.
            Si SEMANA no es "todas", diseñá únicamente los carruseles de esa semana.
            Éxito = todos los JSON visuales del alcance existen y la validación finaliza sin errores.

      - name: Validar assets
        shell: bash
        run: |
          set -euo pipefail
          SEMANA_ARGS=()
          if [ "${{ inputs.semana }}" != "todas" ]; then
            SEMANA_ARGS=(--semana "${{ inputs.semana }}")
          fi
          python scripts/validar_assets_mes.py --mes "${{ inputs.mes }}" "${SEMANA_ARGS[@]}" --require-approved

      - name: Commit de especificaciones visuales
        run: |
          git config user.name "motion-engine"
          git config user.email "engine@motion.local"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add design-system/slides/
          git commit -m "assets: preparar ${{ inputs.mes }} semana ${{ inputs.semana }}" || echo "sin cambios"
          git push origin "HEAD:${GITHUB_REF_NAME}"

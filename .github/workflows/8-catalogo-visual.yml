name: Catalogo visual line_system

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch o SHA a renderizar"
        default: "feat/assets-visuales-semana-2026-08-04"

jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          pip install --quiet -r design-system/line_system/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Renderizar catalogos
        run: |
          python design-system/line_system/catalogo.py
          python design-system/line_system/catalogo_esquemas.py

      - uses: actions/upload-artifact@v4
        with:
          name: catalogo-visual
          path: |
            design-system/line_system/catalogo/
            design-system/line_system/catalogo-esquemas/

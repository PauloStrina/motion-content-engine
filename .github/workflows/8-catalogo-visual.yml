name: Catalogo visual line_system

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch o SHA a renderizar"
        default: "feat/assets-visuales-semana-2026-08-04"

jobs:
  catalogo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          pip install --quiet -r design-system/line_system/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Renderizar catalogos
        run: |
          python design-system/line_system/catalogo.py
          python design-system/line_system/catalogo_esquemas.py

      - name: Commitear catalogos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f design-system/line_system/catalogo design-system/line_system/catalogo-esquemas
          git commit -m "chore: regenerar catalogos visuales" || echo "sin cambios"
          git push origin HEAD:${{ inputs.ref }}
